[project]
name = "vision-agent-real-demo"
version = "1.0.0"
description = "基于 Vision-Agents 的实时交互感知演示"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Qwen text bridging currently relies on the verified 0.6.9 adapter surface.
    "vision-agents[gemini,getstream,local,qwen,ultralytics]==0.6.9",
    "python-dotenv>=1.0.0",
    "certifi>=2024.8.30",
    # Direct dependency: scripts/smoke_qwen_realtime.py imports websockets.
    "websockets==15.0.1",
    "aiohttp==3.14.3",
    "aiortc==1.14.0",
    "av==16.1.0",
    # Memory MCP tools target the installed v1 SDK contract explicitly.
    "mcp==1.29.1",
]

[project.optional-dependencies]
openai = ["vision-agents[openai]"]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The runnable desktop entry point is ``agent_local.py``.  Keep the two
# top-level modules in wheels as well as the ``coach`` package so an installed
# copy has the same imports as a checkout.
py-modules = ["agent_local", "agent_local_agent"]

[tool.setuptools.packages.find]
include = ["coach*"]

[tool.setuptools.package-data]
coach = ["browser_media.html"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
