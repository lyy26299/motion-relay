name: Validate architecture patch

on:
  push:
    branches: [research/agent-architecture-v2]
    paths:
      - .github/architecture-v2.patch.zlib.*
      - .github/workflows/materialize-v2.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'lyy26299/motion-relay' && github.ref == 'refs/heads/research/agent-architecture-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: '1'
      RUN_LIVE_QWEN_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply locally tested source patch
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          parts = [pathlib.Path(f'.github/architecture-v2.patch.zlib.{i}').read_bytes() for i in range(3)]
          # Normalize a known base64 transport typo. The complete decoded patch
          # must match the locally tested SHA-256 before any source is changed.
          encoded = base64.b64encode(parts[0]).decode()
          assert encoded.count('cbra3WpwWlNvUR') == 1
          parts[0] = base64.b64decode(encoded.replace('cbra3WpwWlNvUR', 'cbra3Wp21YvUR') + '+', validate=True)
          patch = zlib.decompress(b''.join(parts))
          expected = 'ab4f0f5ac1bb59db876e66503af0cad8d4384c261edc738d799c1c04742d12db'
          assert hashlib.sha256(patch).hexdigest() == expected
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          pathlib.Path('artifacts/patch-sha256.txt').write_text(expected + '\n')
          PY
      - name: Prepare reviewable commits without changing main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent_local.py coach/runtime.py coach/working_memory.py coach/immutable.py coach/exercises/squat.py coach/memory/writer.py tests/test_runtime_boundaries.py
          git commit -m 'fix: preserve motion pause, stream and ledger ownership'
          git add agent_local_agent.py coach/agent_loop.py coach/operations.py coach/arbiter.py coach/session_agent.py coach/qwen_duplex.py tests/test_agent_architecture_v2.py tests/test_qwen_architecture_v2.py
          git commit -m 'refactor: bound agent work and arbitrate guarded feedback'
          git rm .github/architecture-v2.patch.zlib.* .github/workflows/materialize-v2.yml
          git add .github/workflows/architecture-tests.yml scripts/benchmark_architecture.py
          git commit -m 'test: add architecture benchmark and reliable CI evidence'
          git rev-parse HEAD | tee artifacts/commit.txt
          git log --oneline -4 > artifacts/commits.txt
          git diff --check f2f104d3c280972bc9e3aecb75fdafe8c76a4f85 HEAD
          git archive --format=zip HEAD -o artifacts/source.zip
      - name: Sync locked dependencies and record environment
        run: |
          python -m pip install uv
          uv sync --locked --extra dev 2>&1 | tee artifacts/sync.log
          uv pip freeze > artifacts/installed.txt
          python --version > artifacts/python.txt
          uv --version > artifacts/uv.txt
          uname -a > artifacts/platform.txt
      - name: Run all deterministic tests
        run: |
          /usr/bin/time -f 'elapsed_seconds=%e' -o artifacts/test-time.txt \
            uv run --no-sync python -m unittest discover -s tests -v \
            2>&1 | tee artifacts/tests.log
      - name: Check syntax and critical lint errors
        run: |
          uv run --no-sync python -m compileall -q coach scripts agent_local.py agent_local_agent.py
          uv run --no-sync ruff check . --select E9,F63,F7,F82 2>&1 | tee artifacts/lint.log
      - name: Compare identical local benchmark harnesses
        run: |
          mkdir -p /tmp/motion-baseline
          git archive f2f104d3c280972bc9e3aecb75fdafe8c76a4f85 | tar -x -C /tmp/motion-baseline
          uv run --no-sync python scripts/benchmark_architecture.py --source-root /tmp/motion-baseline --source-revision f2f104d3c280972bc9e3aecb75fdafe8c76a4f85 --iterations 5000 --output artifacts/benchmark-main.json
          uv run --no-sync python scripts/benchmark_architecture.py --source-root "$PWD" --source-revision "$(git rev-parse HEAD)" --iterations 5000 --output artifacts/benchmark-v2.json
      - name: Publish only after all verification steps passed
        run: |
          test "$(git branch --show-current)" = research/agent-architecture-v2
          git diff --exit-code
          git push origin HEAD:research/agent-architecture-v2
      - name: Retain source and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-v2-validation-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
